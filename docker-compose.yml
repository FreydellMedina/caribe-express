services:
  # 1. Base de Datos MongoDB (localhost:27017)
  mongodb:
    image: mongo:7.0
    container_name: caribe-express-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - caribe-network

  # 2. Backend API (Python 3.11 + FastAPI + MongoDB)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: caribe-express-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=caribe_express
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - caribe-network

  # 3. Frontend Web (React + Tailwind CSS + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caribe-express-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - caribe-network

networks:
  caribe-network:
    driver: bridge

volumes:
  mongodb_data:
