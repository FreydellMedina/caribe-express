services:
  # 1. Backend API (Python 3.11 + FastAPI + SQLAlchemy)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: caribe-express-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - caribe-network

  # 2. Frontend Web (React 19 + Tailwind CSS + Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caribe-express-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - caribe-network

  # 3. Base de Datos Local con Soporte PostGIS (Opcional si se usa Supabase)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: caribe-express-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Thegreen098123.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caribe-network
    profiles:
      - local-db

networks:
  caribe-network:
    driver: bridge

volumes:
  postgres_data:

